cross_cutting_layers:
  - id: AUTH
    routes: [/auth]
    subject: secure threshold into Nexus
    allowed_assets: registry-authorized Auth assets only
    states: [loading, error, locked, recovery]
    prohibitions: [unconfirmed_session, unsafe_error_copy, local_auth_success]
  - id: TUTORIAL
    routes: [/tutorial]
    subject: contextual onboarding inside the same Nexus
    allowed_assets: [tutorial/main.png]
    states: [loading, locked, pending, error, recovery]
    prohibitions: [local_gate_skip, local_step_completion, separate_product_identity]

common_acceptance:
  required: [asset_provenance, live_data, state_matrix, tap, back, retry, safe_area, reduced_motion, audio_mute, recovery, device_evidence]
  performance:
    target: 60 FPS in Battlefield and replay
    p95_frame_time_ms: 16.7
    p99_frame_time_ms: 25
    capture_seconds: 30
    result: NOT_MEASURED
  release_gate: APK, authenticated QA, and physical evidence are not authorized in this unit
  promotion_blockers: [missing_device_evidence, generic_fallback, unconfirmed_data, premature_success, crash_or_oom, unresolved_PROFILE_HISTORY_STATE_GAP]
