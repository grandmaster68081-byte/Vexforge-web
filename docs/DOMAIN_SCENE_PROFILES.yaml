    lighting: centered_axis_with_domain_contrast
    physical_result: NOT_MEASURED
    vfx_tier: NOT_MEASURED
    data_sources: [Opponent, PlayerRank, BattleResult, BattleTurn, BattleUnit, Battle_Run, Event_Log]
    states: [loading, empty, pending, error, locked, completed, recovery]
    interaction: [legal_target_selection, action_input, replay, abandon_or_timeout, retry, back]
    authorized_asset_paths:
      - mobile/assets/images/battle-reference-scene.png
      - backgrounds/bg_pvp.jpg
      - backgrounds/bg_bosses.jpg
    prohibitions: [local_combat_simulation, free_camera_in_ranked, rejected_target_telegraph, hidden_units, local_damage_calculation, local_outcome]
