unit: T0 — DOMAIN_SCENE_PROFILES
status: PREPARED / EVIDENCE_REQUIRED
environment: Android in mobile/**
baseline_commit: 347620eb9530523de73f561f53d15882feb8875c
authority:
  document: public.vexforge_official_documents / vexforge_home_world_system_protocol_v3
  status: ACTIVE
  version: V2.2
