rules:
  - Profiles describe composition and presentation constraints; they do not create gameplay, data, assets, routes, RPCs, or rewards.
  - Asset paths are authorized only when their registry state and domain allow consumption.
  - Missing, null, pending, unavailable, or unmeasured values remain explicit; they are never converted to zero or success.
  - vfx_tier remains NOT_MEASURED until device evidence exists; reduced effects cannot alter outcome, hash, replay, legalidad, or settlement.
  - Auth and Tutorial are cross-cutting layers, not additional product domains.
profiles:
  - id: DSP-01
    domain: NEXUS_HOME
    routes: ["/(tabs)/"]
    subject: citadel, forge core, physical portals, and live activity
    material: obsidian, stone, forged iron, gold, cyan arcane light
    accent: cyan + gold
    composition: world scene, hero identity, physical portals, live data plaques, navigation actions
    depth_layers: [background, midground, foreground, diegetic_data, system_safe_area]
    lighting: domain_accented
    physical_result: NOT_MEASURED
    vfx_tier: NOT_MEASURED
    data_sources: [HomeStats, HomeMission, DailyCard, ActivityItem, PlayerProgress, Wallet, PlayerStats]
    states: [loading, empty, partial, error, recovery]
    interaction: [portal navigation, pull_to_refresh, retry]
    authorized_asset_paths:
      - mobile/assets/images/vexforge-home-hero.png
      - mobile/assets/images/vexforge-hero-sentinel.png
      - mobile/assets/images/vexforge-feature-card.png
      - lobby/main.jpg
      - logo/IMG_20260606_040509_906.jpg
    prohibitions: [dashboard_grid, invented_activity, invented_progress, silent_asset_substitution]
    acceptance: first_impression, hero_legibility, portal_navigation, safe_area, recovery, reduced_motion

