name: VEXFORGE Unity GameCI Direct Personal Foundation

on:
  workflow_dispatch:
    inputs:
      unity_version:
        description: "Unity editor version from unity/ProjectSettings/ProjectVersion.txt"
        required: true
        default: "6000.3.24f1"
        type: string

permissions:
  contents: write

jobs:
  gameci-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - name: Verify Unity credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UNITY_EMAIL" || { echo "Missing GitHub Actions secret: UNITY_EMAIL" >&2; exit 1; }
          test -n "$UNITY_PASSWORD" || { echo "Missing GitHub Actions secret: UNITY_PASSWORD" >&2; exit 1; }
          echo "Unity credentials are present; values are not printed."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Activate Unity Personal license
        uses: game-ci/unity-activate@v2
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSING_METHOD: personal
        with:
          unityVersion: ${{ inputs.unity_version }}

      - name: Build Unity Android APK with GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: ${{ inputs.unity_version }}
          targetPlatform: Android
          buildMethod: VexForge.Editor.VexForgeBuild.BuildAndroid
          androidExportType: androidPackage
          buildName: VEXFORGE-Foundation
          versioning: None
          allowDirtyBuild: true
          skipActivation: true

      - name: Locate and verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find unity/Builds build -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          test -n "$APK" || { echo "No APK produced."; exit 1; }
          METADATA="$(find unity/Builds build -type f -name 'vexforge-foundation-build-info.json' -print -quit 2>/dev/null || true)"
          test -n "$METADATA" || { echo "Foundation metadata was not produced."; exit 1; }
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 1000000
          grep -F '"applicationId": "com.vexforge.android"' "$METADATA"
          grep -F '"version": "1.0.2"' "$METADATA"
          grep -F '"versionCode": 5' "$METADATA"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c%s "$APK")"
          mkdir -p build/foundation-metadata
          cp "$METADATA" build/foundation-metadata/vexforge-foundation-build-info.json
          {
            echo "product=VEXFORGE"
            echo "runtime=Unity 6.3 LTS"
            echo "editor=${{ inputs.unity_version }}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "apk=${APK}"
            echo "apk_size_bytes=${SIZE}"
            echo "apk_sha256=${SHA}"
          } | tee build/foundation-metadata/vexforge-ci-build-info.txt
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VEXFORGE-Unity-GameCI-Direct-Personal-${{ github.run_number }}
          path: |
            unity/Builds/**/*.apk
            build/**/*.apk
            build/foundation-metadata/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vexforge-unity-gameci-personal-${{ github.run_number }}
          name: VEXFORGE Unity GameCI Direct Personal ${{ github.run_number }}
          prerelease: true
          body: |
            VEXFORGE Unity Foundation
            Route 5 — GameCI direct Personal
            Unity 6.3 LTS
            Editor ${{ inputs.unity_version }}
            Android ARM64
            IL2CPP
            Foundation only
          files: |
            unity/Builds/**/*.apk
            build/**/*.apk
            build/foundation-metadata/*