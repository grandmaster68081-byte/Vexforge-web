name: VEXFORGE Unity shader cache experiment

on:
  workflow_dispatch:
    inputs:
      shard_count:
        description: "Number of deterministic shader shards to warm before the final APK"
        required: true
        default: "50"
        type: string

permissions:
  contents: read

jobs:
  sequential-shader-cache-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      SHARD_COUNT: ${{ inputs.shard_count }}

    steps:
      - name: Verify Unity license inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${UNITY_LICENSE:-}" ]; then
            echo "A complete Unity ULF license secret is available; online activation will be skipped."
          else
            test -n "$UNITY_EMAIL" || { echo "Missing GitHub Actions secret: UNITY_EMAIL" >&2; exit 1; }
            test -n "$UNITY_PASSWORD" || { echo "Missing GitHub Actions secret: UNITY_PASSWORD" >&2; exit 1; }
            echo "Unity online activation inputs are present; values are not printed."
          fi

      - name: Validate experiment inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHARD_COUNT" =~ ^[0-9]+$ ]]
          test "$SHARD_COUNT" -ge 2
          test "$SHARD_COUNT" -le 100
          echo "Sequential shader cache experiment will warm $SHARD_COUNT deterministic shards."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Unity editor version
        id: unity-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^m_EditorVersion: //p' unity/ProjectSettings/ProjectVersion.txt)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Using Unity editor $version"

      - name: Install Unity Hub for licensing client
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://hub.unity3d.com/linux/keys/public | sudo gpg --dearmor --yes -o /etc/apt/keyrings/unityhub.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/unityhub.gpg] https://hub.unity3d.com/linux/repos/deb stable main" | sudo tee /etc/apt/sources.list.d/unityhub.list
          sudo apt-get update
          sudo apt-get install -y unityhub
          test -x /usr/lib/unityhub/unityhub

      - name: Install Unity CLI
        shell: bash
        env:
          UNITY_VERSION: ${{ steps.unity-version.outputs.version }}
          UNITY_CLI_HOME: ${{ runner.temp }}/unity-cli
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/unity-home"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/unity-config"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/unity-runtime"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_RUNTIME_DIR" "$UNITY_CLI_HOME"
          curl -fsSL https://unity.com/install.sh | UNITY_CLI_CHANNEL=beta UNITY_CLI_HOME="$UNITY_CLI_HOME" bash
          export PATH="$UNITY_CLI_HOME/bin:$PATH"
          unity --version
          unity install "$UNITY_VERSION" -m android --cm --accept-eula
          editor="$(find "$HOME/Unity/Hub/Editor" -type f -path "*/Editor/Unity" -print -quit 2>/dev/null || true)"
          test -x "$editor"
          echo "UNITY_EDITOR_PATH=$editor" >> "$GITHUB_ENV"
          echo "Unity Editor installed at $editor"

      - name: Prepare Unity license directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unity-home" "$RUNNER_TEMP/vexforge-license"

      - name: Normalize Unity ID email
        shell: bash
        run: |
          set -euo pipefail
          email="$(printf '%s' "$UNITY_EMAIL" | tr -d '\r\n')"
          email="${email#\"}"
          email="${email%\"}"
          email="${email#\'}"
          email="${email%\'}"
          if [[ "$email" != *@*.* || "$email" == *[[:space:]]* ]]; then
            echo "UNITY_EMAIL must be the Unity ID email address, without quotes or spaces." >&2
            exit 1
          fi
          echo "::add-mask::$email"
          printf 'UNITY_EMAIL_CLEAN=%s\n' "$email" >> "$GITHUB_ENV"

      - name: Install stored Unity license
        if: env.UNITY_LICENSE != ''
        shell: bash
        env:
          UNITY_VERSION: ${{ steps.unity-version.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s' "$UNITY_LICENSE" > "$RUNNER_TEMP/vexforge-license/Unity_lic.ulf"
          test -s "$RUNNER_TEMP/vexforge-license/Unity_lic.ulf"
          echo "Stored Unity ULF license materialized without printing its value."

      - name: Activate Unity license
        if: env.UNITY_LICENSE == ''
        uses: buildalon/activate-unity-license@v2
        env:
          HOME: ${{ runner.temp }}/unity-home
          UNITY_HUB_PATH: /usr/lib/unityhub/unityhub
          UNITY_COMMON_DIR: ${{ runner.temp }}/vexforge-license
        with:
          license: personal
          username: ${{ env.UNITY_EMAIL_CLEAN }}
          password: ${{ secrets.UNITY_PASSWORD }}
          license-version: 6.x

      - name: Warm shader shards sequentially
        shell: bash
        env:
          HOME: ${{ runner.temp }}/unity-home
          UNITY_COMMON_DIR: ${{ runner.temp }}/vexforge-license
        run: |
          set -euo pipefail
          mkdir -p build-artifacts/shader-checkpoints unity/Builds/ShaderShardWarmup
          test -x "$UNITY_EDITOR_PATH"
          : > build-artifacts/shader-checkpoints/checkpoints.tsv

          for ((index=0; index<SHARD_COUNT; index++)); do
            echo "=== warming shader shard $((index + 1))/$SHARD_COUNT ==="
            rm -f "unity/Builds/ShaderShardWarmup/shard-${index}-of-${SHARD_COUNT}/VEXFORGE-shader-shard-${index}.apk"
            set +e
            VEXFORGE_SHADER_SHARD_MODE=warm \
            VEXFORGE_SHADER_SHARD_INDEX="$index" \
            VEXFORGE_SHADER_SHARD_COUNT="$SHARD_COUNT" \
            "$UNITY_EDITOR_PATH" \
              -batchmode \
              -nographics \
              -quit \
              -accept-apiupdate \
              -projectPath "$GITHUB_WORKSPACE/unity" \
              -buildTarget Android \
              -executeMethod Vexforge.Editor.VexforgeShaderShardBuild.WarmShaderShard \
              -logFile "$GITHUB_WORKSPACE/build-artifacts/shader-checkpoints/unity-shard-${index}.log"
            editor_status=$?
            set -e
            test "$editor_status" -eq 0

            summary="unity/Builds/ShaderShardWarmup/checkpoints/vexforge-shader-shard-$(printf '%03d' "$index")-of-$(printf '%03d' "$SHARD_COUNT").json"
            test -s "$summary"
            cache_dir="unity/Library/ShaderCache"
            cache_files=0
            cache_bytes=0
            if [ -d "$cache_dir" ]; then
              cache_files="$(find "$cache_dir" -type f | wc -l | tr -d ' ')"
              cache_bytes="$(du -sb "$cache_dir" | awk '{print $1}')"
            fi
            printf '%s\t%s\t%s\t%s\n' "$index" "$SHARD_COUNT" "$cache_files" "$cache_bytes" >> build-artifacts/shader-checkpoints/checkpoints.tsv
            rm -f "unity/Builds/ShaderShardWarmup/shard-${index}-of-${SHARD_COUNT}/VEXFORGE-shader-shard-${index}.apk"
          done

      - name: Build final Android APK from accumulated cache
        shell: bash
        env:
          HOME: ${{ runner.temp }}/unity-home
          UNITY_COMMON_DIR: ${{ runner.temp }}/vexforge-license
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          test -x "$UNITY_EDITOR_PATH"
          editor_log="$GITHUB_WORKSPACE/build-artifacts/unity-final-editor.log"
          started_at=$(date +%s)
          set +e
          "$UNITY_EDITOR_PATH" \
            -batchmode \
            -nographics \
            -quit \
            -accept-apiupdate \
            -projectPath "$GITHUB_WORKSPACE/unity" \
            -buildTarget Android \
            -executeMethod Vexforge.Editor.VexforgeShaderShardBuild.BuildAndroid \
            -logFile "$editor_log"
          editor_status=$?
          set -e
          elapsed=$(( $(date +%s) - started_at ))
          echo "Unity final Editor exit code=$editor_status elapsed_seconds=$elapsed"
          if [ -f "$editor_log" ]; then
            tail -n 200 "$editor_log"
          fi
          test "$editor_status" -eq 0

      - name: Verify final APK and checkpoint evidence
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find unity/Builds -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          size="$(stat -c%s "$apk")"
          sha="$(sha256sum "$apk" | awk '{print $1}')"
          test "$size" -gt 1000000
          test -s build-artifacts/shader-checkpoints/checkpoints.tsv
          {
            echo "product=VEXFORGE"
            echo "runtime=Unity"
            echo "editor=$(sed -n 's/^m_EditorVersion: //p' unity/ProjectSettings/ProjectVersion.txt)"
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "shard_count=${SHARD_COUNT}"
            echo "apk=$apk"
            echo "apk_size_bytes=$size"
            echo "apk_sha256=$sha"
          } | tee build-artifacts/vexforge-shader-experiment-info.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VEXFORGE-Unity-Shader-Experiment-${{ github.run_number }}
          path: |
            unity/Builds/**/*.apk
            unity/Builds/ShaderShardWarmup/checkpoints/**
            build-artifacts/**
          if-no-files-found: warn
          retention-days: 14