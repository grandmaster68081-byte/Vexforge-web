# VEXFORGE — CI de verificacion (archivo listo para activar)
#
# Activado el 2026-08-24 (GITHUB_PAT con scope workflow).
name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Valores publicos (publishable + URL del proyecto). Nunca poner service_role aqui.
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://rscuzqnfccqvltkdcdny.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_3eGRSpvxptO09eQQzpxysQ_Imq8zi58' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Instalar dependencias
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Verificacion completa
        run: npm run verify:all
