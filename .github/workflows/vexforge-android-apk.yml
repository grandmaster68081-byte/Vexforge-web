name: Build VEXFORGE Android APK
on:
  workflow_dispatch:
  push:
    paths: [ 'mobile/**', '.github/workflows/vexforge-android-apk.yml' ]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: write }
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install dependencies from package manifest
        run: |
          # Replit's package firewall can leak into runner-level npm config.
          # Keep the install deterministic from the manifest while forcing the
          # public registry and never writing a runner-generated lockfile.
          for attempt in 1 2 3; do
            rm -rf node_modules
            if env -u npm_config_registry -u NPM_CONFIG_REGISTRY \
              npm_config_registry=https://registry.npmjs.org/ \
              npm_config_fetch_retries=5 \
              npm_config_fetch_retry_factor=2 \
              npm_config_fetch_retry_mintimeout=1000 \
              npm_config_fetch_retry_maxtimeout=120000 \
              npm install --package-lock=false --legacy-peer-deps --no-audit --no-fund --ignore-scripts --prefer-online \
              && test -x node_modules/.bin/expo; then
              exit 0
            fi
            echo "Dependency installation attempt $attempt did not create Expo CLI; retrying"
            sleep 5
          done
          exit 1
      - run: npm run typecheck
      - run: npm run verify:telemetry
      - name: Verify all mobile contracts
        run: |
          cd ..
          for guard in scripts/verify-mobile-*.mjs; do
            echo "Running $guard"
            node "$guard"
          done
      - run: npx expo prebuild --platform android --no-install --non-interactive
      # Release variant always embeds index.android.bundle, so the installed app
      # never looks for a Metro dev server. Expo's template signs release with the
      # debug keystore, which keeps the APK sideload-installable.
      - name: Build installable APK
        working-directory: mobile/android
        run: >-
          ./gradlew assembleRelease --no-daemon --stacktrace --console=plain
          --max-workers=2
          -x lintVitalAnalyzeRelease
          -x lintVitalReportRelease
          -x lintVitalRelease
      - name: Verify the APK is standalone
        working-directory: mobile/android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "APK missing"; exit 1; }
          unzip -l "$APK" | grep -q 'assets/index.android.bundle' \
            || { echo "FAIL: JS bundle not embedded — the app would crash on launch"; exit 1; }
          echo "OK: JS bundle embedded ($(du -h "$APK" | cut -f1))"
      - name: Verify APK identity and record digest
        working-directory: mobile/android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT" || { echo "aapt not found"; exit 1; }
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.vexforge.android' versionCode='4' versionName='1.0.1'"
          SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run=${GITHUB_RUN_ID}"
            echo "apk=app-release.apk"
            echo "package=com.vexforge.android"
            echo "version=1.0.1"
            echo "versionCode=4"
            echo "sha256=${SHA256}"
          } | tee "$GITHUB_WORKSPACE/vexforge-android-build-info.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vexforge-android-apk-${{ github.run_number }}
          path: |
            mobile/android/app/build/outputs/apk/release/app-release.apk
            vexforge-android-build-info.txt
          if-no-files-found: error
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vexforge-android-build-${{ github.run_number }}
          name: VEXFORGE Android build ${{ github.run_number }}
          body: Standalone installable Android APK (JS bundle embedded, release variant).
          files: mobile/android/app/build/outputs/apk/release/app-release.apk
          prerelease: true
