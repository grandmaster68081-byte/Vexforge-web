name: Build VEXFORGE Android APK
on:
  workflow_dispatch:
  push:
    paths: [ 'mobile/**', '.github/workflows/vexforge-android-apk.yml' ]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: write }
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install dependencies from package manifest
        run: |
          # The committed lockfile was generated inside Replit and contains
          # development-only package-firewall URLs. GitHub Actions must resolve
          # from the public registry instead of consuming those URLs.
          for attempt in 1 2 3; do
            rm -rf node_modules
            if env -u npm_config_registry -u NPM_CONFIG_REGISTRY \
              npm_config_registry=https://registry.npmjs.org/ \
              npm install --package-lock=false --legacy-peer-deps --no-audit --no-fund --ignore-scripts --prefer-online \
              && test -x node_modules/.bin/expo; then
              exit 0
            fi
            echo "Dependency installation attempt $attempt did not create Expo CLI; retrying"
            sleep 5
          done
          exit 1
      - run: npm run typecheck
      - run: npm run verify:telemetry
      - run: npx expo prebuild --platform android --no-install --non-interactive
      # Release variant always embeds index.android.bundle, so the installed app
      # never looks for a Metro dev server. Expo's template signs release with the
      # debug keystore, which keeps the APK sideload-installable.
      - name: Build installable APK
        working-directory: mobile/android
        run: >-
          ./gradlew assembleRelease --no-daemon --stacktrace --console=plain
          --max-workers=2
          -x lintVitalAnalyzeRelease
          -x lintVitalReportRelease
      - name: Verify the APK is standalone
        working-directory: mobile/android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "APK missing"; exit 1; }
          unzip -l "$APK" | grep -q 'assets/index.android.bundle' \
            || { echo "FAIL: JS bundle not embedded — the app would crash on launch"; exit 1; }
          echo "OK: JS bundle embedded ($(du -h "$APK" | cut -f1))"
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vexforge-android-build-${{ github.run_number }}
          name: VEXFORGE Android build ${{ github.run_number }}
          body: Standalone installable Android APK (JS bundle embedded, release variant).
          files: mobile/android/app/build/outputs/apk/release/app-release.apk
          prerelease: true
