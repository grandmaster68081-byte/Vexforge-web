# Keep this established file path so GitHub retains the existing workflow
# identity and build history while the Android runtime moves from Unity to Expo.
name: Build VEXFORGE Expo Android on GitHub

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vexforge-expo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-expo-android:
    name: Validate and compile installable Expo Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://rscuzqnfccqvltkdcdny.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_3eGRSpvxptO09eQQzpxysQ_Imq8zi58' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install locked Expo dependencies from public npm
        working-directory: mobile
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lockPath = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          let rewritten = 0;

          for (const entry of Object.values(lock.packages ?? {})) {
            if (typeof entry.resolved !== 'string') continue;
            const updated = entry.resolved.replace(
              /^http:\/\/package-firewall\.replit\.internal\/npm\//,
              'https://registry.npmjs.org/',
            );
            if (updated !== entry.resolved) {
              entry.resolved = updated;
              rewritten += 1;
            }
          }

          const remainingInternalUrls = Object.values(lock.packages ?? {})
            .filter((entry) => entry.resolved?.includes('package-firewall.replit.internal'));
          if (remainingInternalUrls.length > 0) {
            throw new Error(`Unsupported internal npm URLs remain: ${remainingInternalUrls.length}`);
          }

          fs.writeFileSync(lockPath, `${JSON.stringify(lock, null, 2)}\n`);
          console.log(`Mapped ${rewritten} lockfile URLs to the public npm registry; versions and integrity hashes are unchanged.`);
          NODE
          npm ci --registry=https://registry.npmjs.org/

      - name: Run the complete mobile/runtime audit suite
        working-directory: mobile
        run: npm run audit:all

      - name: Check Expo compatibility
        working-directory: mobile
        run: npm run doctor

      - name: Generate the Android native project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compile the installable review APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify and describe the APK
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          size="$(stat -c%s "$apk")"
          test "$size" -gt 1000000
          mkdir -p build-artifacts
          sha256sum "$apk" | awk '{print $1 "  app-debug.apk"}' > build-artifacts/SHA256SUMS.txt
          {
            echo "VEXFORGE Expo Android review build"
            echo "Commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Version: $(node -p "require('./app.json').expo.version")"
            echo "Package: $(node -p "require('./app.json').expo.android.package")"
            echo "APK bytes: $size"
            echo "SHA-256: $(awk '{print $1}' build-artifacts/SHA256SUMS.txt)"
          } > build-artifacts/BUILD_INFO.txt
          cat build-artifacts/BUILD_INFO.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK for review
        uses: actions/upload-artifact@v4
        with:
          name: VEXFORGE-APK-${{ github.run_number }}-review
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/build-artifacts/BUILD_INFO.txt
            mobile/build-artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7