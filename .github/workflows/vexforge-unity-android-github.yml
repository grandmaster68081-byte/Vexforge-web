name: Build VEXFORGE Unity Android on GitHub

on:
  workflow_dispatch:
  push:
    paths:
      - "unity/**"
      - ".github/workflows/vexforge-unity-android-github.yml"

permissions:
  contents: write

jobs:
  build-unity-android:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

    steps:
      - name: Verify Unity license inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${UNITY_LICENSE:-}" ]; then
            echo "A complete Unity ULF license secret is available; online activation will be skipped."
          else
            test -n "$UNITY_EMAIL" || { echo "Missing GitHub Actions secret: UNITY_EMAIL" >&2; exit 1; }
            test -n "$UNITY_PASSWORD" || { echo "Missing GitHub Actions secret: UNITY_PASSWORD" >&2; exit 1; }
            echo "Unity online activation inputs are present; values are not printed."
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Unity editor version
        id: unity-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^m_EditorVersion: //p' unity/ProjectSettings/ProjectVersion.txt)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Using Unity editor $version"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Unity Hub
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://hub.unity3d.com/linux/keys/public | sudo gpg --dearmor --yes -o /etc/apt/keyrings/unityhub.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/unityhub.gpg] https://hub.unity3d.com/linux/repos/deb stable main" | sudo tee /etc/apt/sources.list.d/unityhub.list
          sudo apt-get update
          sudo apt-get install -y unityhub

      - name: Prepare Unity license directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unity-home" "$RUNNER_TEMP/vexforge-license"

      - name: Install stored Unity license
        if: env.UNITY_LICENSE != ''
        shell: bash
        env:
          UNITY_VERSION: ${{ steps.unity-version.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s' "$UNITY_LICENSE" > "$RUNNER_TEMP/vexforge-license/Unity_v${UNITY_VERSION}.ulf"
          test -s "$RUNNER_TEMP/vexforge-license/Unity_v${UNITY_VERSION}.ulf"
          echo "Stored Unity ULF license materialized without printing its value."

      - name: Activate Unity license
        if: env.UNITY_LICENSE == ''
        uses: buildalon/activate-unity-license@v2
        env:
          HOME: ${{ runner.temp }}/unity-home
          UNITY_HUB_PATH: /usr/lib/unityhub/unityhub
          UNITY_COMMON_DIR: ${{ runner.temp }}/vexforge-license
        with:
          license: personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}
          license-version: 6.x

      - name: Verify generated Unity license
        shell: bash
        env:
          UNITY_VERSION: ${{ steps.unity-version.outputs.version }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/vexforge-license/Unity_v${UNITY_VERSION}.ulf"
          echo "Unity license is ready for the Editor; value is not printed."

      - name: Build Unity Android APK
        shell: bash
        env:
          UNITY_VERSION: ${{ steps.unity-version.outputs.version }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/unity-home" build-artifacts
          unity_exit=0
          docker run --rm \
            --env HOME=/tmp/unity-home \
            --env UNITY_VERSION \
            --volume "$RUNNER_TEMP/unity-home:/tmp/unity-home" \
            --volume "$RUNNER_TEMP/vexforge-license:/license:ro" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "unityci/editor:ubuntu-${UNITY_VERSION}-android-3" \
            bash -lc '
              set -euo pipefail
              unity-editor \
                -batchmode \
                -nographics \
                -quit \
                -manualLicenseFile "/license/Unity_v${UNITY_VERSION}.ulf" \
                -logFile /workspace/build-artifacts/license-import.log
              unity-editor \
                -batchmode \
                -nographics \
                -quit \
                -projectPath /workspace/unity \
                -buildTarget Android \
                -executeMethod Vexforge.Editor.VexforgeGitHubBuild.BuildAndroid \
                -logFile /workspace/build-artifacts/unity-editor.log
            ' || unity_exit=$?
          echo "Unity build exit code: $unity_exit"
          exit "$unity_exit"

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find unity/Builds -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          size="$(stat -c%s "$apk")"
          sha="$(sha256sum "$apk" | awk '{print $1}')"
          test "$size" -gt 1000000
          {
            echo "product=VEXFORGE"
            echo "runtime=Unity"
            echo "editor=$(sed -n 's/^m_EditorVersion: //p' unity/ProjectSettings/ProjectVersion.txt)"
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "apk=$apk"
            echo "apk_size_bytes=$size"
            echo "apk_sha256=$sha"
          } | tee build-artifacts/vexforge-build-info.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Unity APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VEXFORGE-Unity-Android-${{ github.run_number }}
          path: |
            unity/Builds/**/*.apk
            build-artifacts/**
          if-no-files-found: warn
          retention-days: 14

      - name: Publish APK release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vexforge-unity-github-${{ github.run_number }}
          name: VEXFORGE Unity Android ${{ github.run_number }}
          prerelease: true
          body: |
            VEXFORGE Unity Android build compiled directly on GitHub Actions.
            Unity editor version is read from unity/ProjectSettings/ProjectVersion.txt.
          files: |
            unity/Builds/**/*.apk
            build-artifacts/vexforge-build-info.txt