name: Build VEXFORGE Unity Android

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vexforge-unity-official-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-unity-android:
    name: Build official Unity Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout the official Unity project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            unity
          sparse-checkout-cone-mode: true

      - name: Verify project boundary and Unity version
        id: unity-version
        shell: bash
        run: |
          set -euo pipefail
          unity_version="$(sed -n 's/^m_EditorVersion: //p' unity/ProjectSettings/ProjectVersion.txt)"
          test -n "$unity_version"
          test -f unity/Assets/Editor/VexforgeBootstrapBuild.cs
          shader_support="unity/Assets/Editor/VexforgeShaderStrippingSettings.cs"
          test -f "$shader_support" || {
            echo "Missing Unity editor support: $shader_support" >&2
            exit 1
          }
          grep -Fq 'namespace Vexforge.Editor' "$shader_support"
          grep -Fq 'public static class VexforgeShaderStrippingSettings' "$shader_support"
          grep -Fq 'public static void ApplyForAndroid()' "$shader_support"
          echo "version=$unity_version" >> "$GITHUB_OUTPUT"
          echo "Unity $unity_version; official editor support is present."

      - name: Verify Unity activation inputs
        id: activation-preflight
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          set -euo pipefail
          if [ -n "${UNITY_LICENSE:-}" ]; then
            echo "A Unity ULF license secret is available; online activation will be skipped."
            echo "mode=ulf" >> "$GITHUB_OUTPUT"
          else
            test -n "$UNITY_EMAIL" || {
              echo "Missing GitHub Actions secret: UNITY_EMAIL" >&2
              exit 1
            }
            test -n "$UNITY_PASSWORD" || {
              echo "Missing GitHub Actions secret: UNITY_PASSWORD" >&2
              exit 1
            }
            echo "Unity online activation inputs are present; values are not printed."
            echo "mode=email-password" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Unity Hub for licensing client
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://hub.unity3d.com/linux/keys/public \
            | sudo gpg --dearmor --yes -o /etc/apt/keyrings/unityhub.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/unityhub.gpg] https://hub.unity3d.com/linux/repos/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/unityhub.list
          sudo apt-get update
          sudo apt-get install -y unityhub
          test -x /usr/lib/unityhub/unityhub

      - name: Install pinned Unity Editor and Android modules
        shell: bash
        env:
          UNITY_VERSION: ${{ steps.unity-version.outputs.version }}
          UNITY_CLI_HOME: ${{ runner.temp }}/unity-cli
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/unity-home"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/unity-config"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/unity-runtime"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_RUNTIME_DIR" "$UNITY_CLI_HOME"
          curl -fsSL https://unity.com/install.sh \
            | UNITY_CLI_CHANNEL=beta UNITY_CLI_HOME="$UNITY_CLI_HOME" bash
          export PATH="$UNITY_CLI_HOME/bin:$PATH"
          unity --version
          unity install "$UNITY_VERSION" -m android --cm --accept-eula
          editor="$(find "$HOME/Unity/Hub/Editor" -type f -path "*/Editor/Unity" -print -quit)"
          test -x "$editor"
          android_root="$(dirname "$editor")/Data/PlaybackEngines/AndroidPlayer"
          for module in SDK NDK OpenJDK; do
            test -d "$android_root/$module" || {
              echo "Unity Android installation is incomplete; missing $module." >&2
              exit 1
            }
          done
          echo "UNITY_EDITOR_PATH=$editor" >> "$GITHUB_ENV"

      - name: Prepare isolated Unity license directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unity-home" "$RUNNER_TEMP/vexforge-unity-license"

      - name: Normalize Unity ID email
        if: steps.activation-preflight.outputs.mode == 'email-password'
        shell: bash
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        run: |
          set -euo pipefail
          email="$(printf '%s' "$UNITY_EMAIL" | tr -d '\r\n')"
          email="${email#\"}"
          email="${email%\"}"
          email="${email#\'}"
          email="${email%\'}"
          if [[ "$email" != *@*.* || "$email" == *[[:space:]]* ]]; then
            echo "UNITY_EMAIL must be a Unity ID email address, without quotes or spaces." >&2
            exit 1
          fi
          echo "::add-mask::$email"
          printf 'UNITY_EMAIL_CLEAN=%s\n' "$email" >> "$GITHUB_ENV"

      - name: Materialize stored Unity license
        if: steps.activation-preflight.outputs.mode == 'ulf'
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          HOME: ${{ runner.temp }}/unity-home
          UNITY_COMMON_DIR: ${{ runner.temp }}/vexforge-unity-license
        run: |
          set -euo pipefail
          printf '%s' "$UNITY_LICENSE" > "$RUNNER_TEMP/vexforge-unity-license/Unity_lic.ulf"
          test -s "$RUNNER_TEMP/vexforge-unity-license/Unity_lic.ulf"
          echo "Stored Unity license materialized without printing its value."

      - name: Activate Unity license
        if: steps.activation-preflight.outputs.mode == 'email-password'
        uses: buildalon/activate-unity-license@v2
        env:
          HOME: ${{ runner.temp }}/unity-home
          UNITY_HUB_PATH: /usr/lib/unityhub/unityhub
          UNITY_COMMON_DIR: ${{ runner.temp }}/vexforge-unity-license
        with:
          license: personal
          username: ${{ env.UNITY_EMAIL_CLEAN }}
          password: ${{ secrets.UNITY_PASSWORD }}
          license-version: 6.x

      - name: Restore official Unity project Library cache
        id: restore-unity-library
        uses: actions/cache/restore@v4
        with:
          path: unity/Library
          key: vexforge-unity-library-${{ runner.os }}-${{ runner.arch }}-${{ steps.unity-version.outputs.version }}-${{ hashFiles('unity/Packages/manifest.json', 'unity/Packages/packages-lock.json', 'unity/ProjectSettings/ProjectSettings.asset') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vexforge-unity-library-${{ runner.os }}-${{ runner.arch }}-${{ steps.unity-version.outputs.version }}-

      - name: Restore pre-promotion Bootstrap Library cache
        id: restore-bootstrap-library
        if: steps.restore-unity-library.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          # Keep the original path so actions/cache uses the legacy cache version.
          path: unity-bootstrap/Library
          key: vexforge-bootstrap-migration-${{ runner.os }}-${{ runner.arch }}-${{ steps.unity-version.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vexforge-bootstrap-library-${{ runner.os }}-${{ runner.arch }}-${{ steps.unity-version.outputs.version }}-

      - name: Relocate restored Bootstrap Library to the official project path
        if: steps.restore-bootstrap-library.outputs.cache-matched-key != ''
        shell: bash
        run: |
          set -euo pipefail
          previous_library="unity-bootstrap/Library"
          official_library="unity/Library"
          test -d "$previous_library" || {
            echo "Legacy Library cache matched but was not restored at its original path." >&2
            exit 1
          }
          test ! -e "$official_library" || {
            echo "Both legacy and official Library directories exist; refusing to merge caches." >&2
            exit 1
          }
          mv "$previous_library" "$official_library"
          rmdir unity-bootstrap
          echo "Moved the compatible Bootstrap Library cache into unity/Library."

      - name: Record cache restore state
        shell: bash
        env:
          CACHE_HIT: ${{ steps.restore-unity-library.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.restore-unity-library.outputs.cache-matched-key }}
          LEGACY_CACHE_MATCHED_KEY: ${{ steps.restore-bootstrap-library.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          if [ "$CACHE_HIT" = true ]; then
            echo "Unity project Library cache restored with an exact key match: $CACHE_MATCHED_KEY" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ -n "$CACHE_MATCHED_KEY" ]; then
            echo "Unity project Library cache restored with a compatible restore-key match: $CACHE_MATCHED_KEY" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ -n "$LEGACY_CACHE_MATCHED_KEY" ]; then
            echo "Unity project Library cache restored from the former Bootstrap path and relocated: $LEGACY_CACHE_MATCHED_KEY" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No compatible Unity project Library cache was available; this run will warm one after the APK succeeds." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the official VEXFORGE APK
        shell: bash
        env:
          UNITY_VERSION: ${{ steps.unity-version.outputs.version }}
          HOME: ${{ runner.temp }}/unity-home
          UNITY_COMMON_DIR: ${{ runner.temp }}/vexforge-unity-license
        run: |
          set -euo pipefail
          mkdir -p build-artifacts
          test -x "$UNITY_EDITOR_PATH"
          editor_log="$GITHUB_WORKSPACE/build-artifacts/unity-android.log"

          "$UNITY_EDITOR_PATH" \
            -batchmode \
            -nographics \
            -quit \
            -accept-apiupdate \
            -projectPath "$GITHUB_WORKSPACE/unity" \
            -buildTarget Android \
            -executeMethod Vexforge.Bootstrap.Editor.VexforgeBootstrapBuild.BuildAndroid \
            -stackTraceLogType Full \
            -logFile "$editor_log" &
          editor_pid=$!
          tail --pid="$editor_pid" --follow=name --retry --lines=80 "$editor_log" &
          tail_pid=$!

          set +e
          wait "$editor_pid"
          editor_status=$?
          wait "$tail_pid"
          tail_status=$?
          set -e

          echo "Unity Editor exit code=$editor_status"
          if [ -f "$editor_log" ]; then
            echo "Unity Editor log streamed from $editor_log"
          else
            echo "Unity Editor log was not created: $editor_log" >&2
          fi
          if [ "$tail_status" -ne 0 ]; then
            echo "Unity log stream exit code=$tail_status" >&2
          fi

          test "$editor_status" -eq 0

      - name: Verify APK and write build report
        id: verify-apk
        shell: bash
        run: |
          set -euo pipefail
          apk="unity/Builds/Vexforge.apk"
          test -s "$apk"
          size="$(stat -c%s "$apk")"
          test "$size" -gt 1000000 || {
            echo "The generated APK is unexpectedly small ($size bytes)." >&2
            exit 1
          }
          sha="$(sha256sum "$apk" | awk '{print $1}')"
          {
            echo "project=unity"
            echo "runtime=Unity"
            echo "editor=$(sed -n 's/^m_EditorVersion: //p' unity/ProjectSettings/ProjectVersion.txt)"
            echo "application_id=com.vexforge.android"
            echo "platform=Android"
            echo "scripting=IL2CPP"
            echo "architecture=ARM64"
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "apk=$apk"
            echo "apk_size_bytes=$size"
            echo "apk_sha256=$sha"
          } | tee build-artifacts/vexforge-android-build-info.txt \
            >> "$GITHUB_STEP_SUMMARY"
          echo "APK verification passed: $size bytes."

      - name: Upload official VEXFORGE APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VEXFORGE-Unity-Android-APK-${{ github.run_number }}
          path: |
            unity/Builds/Vexforge.apk
            build-artifacts/vexforge-android-build-info.txt
          if-no-files-found: error
          retention-days: 7

      - name: Save official Unity project Library cache
        if: success() && steps.verify-apk.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: unity/Library
          key: vexforge-unity-library-${{ runner.os }}-${{ runner.arch }}-${{ steps.unity-version.outputs.version }}-${{ hashFiles('unity/Packages/manifest.json', 'unity/Packages/packages-lock.json', 'unity/ProjectSettings/ProjectSettings.asset') }}-${{ github.run_id }}-${{ github.run_attempt }}
