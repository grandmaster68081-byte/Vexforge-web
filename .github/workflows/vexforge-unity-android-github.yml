# Keep this established file path so GitHub retains the existing workflow
# identity and build history while the Android runtime moves from Unity to Expo.
name: Build VEXFORGE Expo Android on GitHub

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vexforge-expo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-expo-android:
    name: Validate and compile installable Expo Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://rscuzqnfccqvltkdcdny.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_3eGRSpvxptO09eQQzpxysQ_Imq8zi58' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install locked Expo dependencies from public npm
        working-directory: mobile
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lockPath = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          let rewritten = 0;

          for (const entry of Object.values(lock.packages ?? {})) {
            if (typeof entry.resolved !== 'string') continue;
            const updated = entry.resolved.replace(
              /^http:\/\/package-firewall\.replit\.internal\/npm\//,
              'https://registry.npmjs.org/',
            );
            if (updated !== entry.resolved) {
              entry.resolved = updated;
              rewritten += 1;
            }
          }

          const remainingInternalUrls = Object.values(lock.packages ?? {})
            .filter((entry) => entry.resolved?.includes('package-firewall.replit.internal'));
          if (remainingInternalUrls.length > 0) {
            throw new Error(`Unsupported internal npm URLs remain: ${remainingInternalUrls.length}`);
          }

          fs.writeFileSync(lockPath, `${JSON.stringify(lock, null, 2)}\n`);
          console.log(`Mapped ${rewritten} lockfile URLs to the public npm registry; versions and integrity hashes are unchanged.`);
          NODE
          npm ci --registry=https://registry.npmjs.org/

      - name: Run the complete mobile/runtime audit suite
        working-directory: mobile
        run: npm run audit:all

      - name: Check Expo compatibility
        working-directory: mobile
        run: npm run doctor

      - name: Generate the Android native project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify generated Android project embeds JavaScript
        working-directory: mobile
        run: node scripts/verify.mjs

      - name: Compile the self-contained installable review APK
        working-directory: mobile/android
        run: >-
          ./gradlew --no-daemon --max-workers=2 --build-cache --stacktrace
          -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          assembleRelease

      - name: Verify and describe the APK
        id: apk
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          apk_entries="$RUNNER_TEMP/vexforge-apk-entries.txt"
          jar tf "$apk" > "$apk_entries"
          if ! grep -Fxq 'assets/index.android.bundle' "$apk_entries"; then
            echo "::error::The APK does not contain assets/index.android.bundle and would require Metro."
            exit 1
          fi
          size="$(stat -c%s "$apk")"
          test "$size" -gt 1000000
          version="$(node -p "require('./app.json').expo.version")"
          package_name="$(node -p "require('./app.json').expo.android.package")"
          asset_name="VEXFORGE-${version}-Android-${GITHUB_RUN_NUMBER}.apk"
          asset_path="$RUNNER_TEMP/$asset_name"
          sha256="$(sha256sum "$apk" | awk '{print $1}')"
          cp "$apk" "$asset_path"
          {
            echo "version=$version"
            echo "package=$package_name"
            echo "asset_name=$asset_name"
            echo "asset_path=$asset_path"
            echo "sha256=$sha256"
            echo "size=$size"
            echo "release_tag=vexforge-android-${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Self-contained VEXFORGE Android APK compiled"
            echo "- Branch: \`main\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Version: \`$version\`"
            echo "- Android package: \`$package_name\`"
            echo "- APK size: $size bytes"
            echo "- SHA-256: \`$sha256\`"
            echo "- Embedded JavaScript: verified (no Metro required)"
            echo "- Delivery: direct GitHub Release download (no Actions artifact)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish APK as a direct GitHub Release download
        id: release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.apk.outputs.release_tag }}
          name: VEXFORGE Android APK ${{ steps.apk.outputs.version }} (#${{ github.run_number }})
          target_commitish: main
          body: |
            Self-contained installable Android review build compiled from `main`; the JavaScript bundle is embedded, so Metro is not required.

            - Commit: `${{ github.sha }}`
            - Version: `${{ steps.apk.outputs.version }}`
            - Package: `${{ steps.apk.outputs.package }}`
            - APK size: `${{ steps.apk.outputs.size }}` bytes
            - SHA-256: `${{ steps.apk.outputs.sha256 }}`
          files: ${{ steps.apk.outputs.asset_path }}
          fail_on_unmatched_files: true
          overwrite_files: true
          draft: false
          prerelease: true
          make_latest: false

      - name: Show the direct download URL
        if: steps.release.outcome == 'success'
        env:
          APK_NAME: ${{ steps.apk.outputs.asset_name }}
          RELEASE_TAG: ${{ steps.apk.outputs.release_tag }}
        run: |
          apk_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_NAME}"
          {
            echo "## Direct APK download"
            echo "[Download the APK]($apk_url)"
            echo
            echo "Release page: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"