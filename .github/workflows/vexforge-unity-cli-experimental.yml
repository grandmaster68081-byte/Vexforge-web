name: VEXFORGE Unity CLI Experimental Foundation

on:
  workflow_dispatch:
    inputs:
      unity_version:
        description: "Unity editor version from unity/ProjectSettings/ProjectVersion.txt"
        required: true
        default: "6000.3.24f1"
        type: string

permissions:
  contents: read

jobs:
  cli-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - name: Verify Unity credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UNITY_EMAIL" || { echo "Missing GitHub Actions secret: UNITY_EMAIL" >&2; exit 1; }
          test -n "$UNITY_PASSWORD" || { echo "Missing GitHub Actions secret: UNITY_PASSWORD" >&2; exit 1; }
          echo "Unity credentials are present; values are not printed."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Unity CLI build with direct Personal authentication
        id: unity-cli
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/unity-home" cli-build
          UNITY_EXIT=0
          docker run --rm \
            --env HOME=/tmp/unity-home \
            --env UNITY_EMAIL \
            --env UNITY_PASSWORD \
            --volume "$RUNNER_TEMP/unity-home:/tmp/unity-home" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "unityci/editor:ubuntu-${{ inputs.unity_version }}-android-3" \
            bash -lc 'set -uo pipefail
              unity-editor \
                -batchmode \
                -nographics \
                -quit \
                -projectPath /workspace/unity \
                -buildTarget Android \
                -username "$UNITY_EMAIL" \
                -password "$UNITY_PASSWORD" \
                -executeMethod VexForge.Editor.VexForgeBuild.BuildAndroid \
                -logFile /workspace/cli-build/unity-editor.log' || UNITY_EXIT=$?
          echo "Unity CLI exit code: $UNITY_EXIT"
          exit "$UNITY_EXIT"

      - name: Verify APK and Foundation metadata
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find unity/Builds build -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          test -n "$APK" || { echo "No APK produced."; exit 1; }
          METADATA="$(find unity/Builds build -type f -name 'vexforge-foundation-build-info.json' -print -quit 2>/dev/null || true)"
          test -n "$METADATA" || { echo "Foundation metadata was not produced."; exit 1; }
          test -s "$APK"
          test "$(stat -c%s "$APK")" -gt 1000000
          grep -F '"applicationId": "com.vexforge.android"' "$METADATA"
          grep -F '"version": "1.0.2"' "$METADATA"
          grep -F '"versionCode": 5' "$METADATA"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          {
            echo "apk=$APK"
            echo "apk_size_bytes=$(stat -c%s "$APK")"
            echo "apk_sha256=$SHA"
          } | tee cli-build/foundation-verification.txt
          cp "$APK" cli-build/
          cp "$METADATA" cli-build/

      - name: Upload CLI logs and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VEXFORGE-Unity-CLI-Experimental-${{ github.run_number }}
          path: |
            cli-build/**
            unity/Builds/**/*.log
          if-no-files-found: warn
          retention-days: 14